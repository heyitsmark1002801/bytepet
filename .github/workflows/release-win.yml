name: Build Windows installer

# Builds the Windows NSIS .exe on a Windows runner and attaches it to the
# release. Also runnable on demand (workflow_dispatch). The Mac build is done
# separately with scripts/build-mac.sh and is not part of this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the Windows installer
        run: npm run build:win
        env:
          # Don't try to code-sign in CI; we ship an unsigned installer.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bytepet-windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
